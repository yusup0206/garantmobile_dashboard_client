server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip text assets on the fly.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml;

  # Basic hardening headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Container/orchestrator health probe.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets are immutable — cache them aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA history fallback: every unknown path serves index.html so client-side
  # routes like /orders or /catalog?cat=phones resolve on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached, or clients pin a stale bundle reference.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
