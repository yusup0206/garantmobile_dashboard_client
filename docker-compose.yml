services:
  web:
    build:
      context: .
      args:
        # Vite bakes these into the bundle at build time.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-GarantMobile}
    image: garantmobile-dashboard:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
